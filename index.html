<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            width: min(100%, 680px);
            height: min(780px, calc(100vh - 40px));
            min-height: 420px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 16px 40px #0f172a12;
        }

        header {
            padding: 22px 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 21px;
        }

        header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        #messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .assistant {
            align-self: flex-start;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
        }

        .error {
            color: #b91c1c;
            border-color: #fecaca;
            background: #fef2f2;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        textarea {
            flex: 1;
            min-width: 0;
            min-height: 46px;
            max-height: 140px;
            resize: vertical;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: inherit;
            font: inherit;
        }

        textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            align-self: flex-end;
            min-height: 46px;
            padding: 0 18px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        @media (max-width: 520px) {
            body {
                padding: 0;
            }

            main {
                width: 100%;
                height: 100vh;
                min-height: 100vh;
                border: 0;
                border-radius: 0;
            }

            #messages {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Buddy Chat</h1>
            <p>Ask your assistant a question</p>
        </header>
        <section id="messages" aria-live="polite" aria-label="Chat messages">
            <div class="message assistant">Hi! What can I help you with?</div>
        </section>
        <form id="chat-form">
            <textarea id="prompt" aria-label="Your message" placeholder="Type a message..." required rows="1"></textarea>
            <button id="send" type="submit">Send</button>
        </form>
    </main>

    <script>
        const messagesElement = document.getElementById("messages");
        const form = document.getElementById("chat-form");
        const promptInput = document.getElementById("prompt");
        const sendButton = document.getElementById("send");
        const apiProtocol = window.location.protocol === "https:" ? "https:" : "http:";
        const apiHost = window.location.hostname || "localhost";
        const apiUrl = `${apiProtocol}//${apiHost}:8000/ask`;

        function addMessage(text, className) {
            const message = document.createElement("div");
            message.className = `message ${className}`;
            message.textContent = text;
            messagesElement.appendChild(message);
            messagesElement.scrollTop = messagesElement.scrollHeight;
            return message;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt || sendButton.disabled) return;

            addMessage(prompt, "user");
            promptInput.value = "";
            sendButton.disabled = true;
            sendButton.textContent = "...";
            const pendingMessage = addMessage("Thinking...", "assistant");
            try {
                const params = new URLSearchParams({ q: prompt });
                const response = await fetch(`${apiUrl}?${params.toString()}`, {
                    method: "GET",
                    headers: { Accept: "application/json" }
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || `Request failed (${response.status})`);
                }
                if (typeof result.answer !== "string") {
                    throw new Error("The assistant returned an invalid response.");
                }

                pendingMessage.textContent = result.answer || "I didn't receive a response.";
            } catch (error) {
                pendingMessage.classList.add("error");
                pendingMessage.textContent =
                    `Couldn't reach the chat API at ${apiUrl}. ` +
                    `Check that the orchestrator is running and allows browser requests. ` +
                    `${error.message}`;
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                promptInput.focus();
                messagesElement.scrollTop = messagesElement.scrollHeight;
            }
        });

        promptInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
</body>
</html>
